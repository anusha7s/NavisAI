<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NavisAI Sidebar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f172a;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --error: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100%;
      height: 100vh;
      font-family: 'Outfit', sans-serif;
      background: #0f172a;
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--surface-border);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
    }

    .logo-container {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      margin-right: 12px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    .logo-container svg { width: 18px; height: 18px; fill: white; }

    h2 { font-size: 1.2rem; font-weight: 600; }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.1); border-radius: 3px; }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      animation: fadeIn 0.3s ease;
    }

    .msg-user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg-agent {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-bottom-left-radius: 4px;
    }

    .step-tracker {
      margin-top: 8px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 8px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-icon {
      width: 14px; height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .step-pending .step-icon { background: var(--surface-border); }
    .step-active .step-icon { background: var(--warning); box-shadow: 0 0 8px var(--warning); animation: pulse 1.5s infinite; }
    .step-done .step-icon { background: var(--success); }
    .step-fail .step-icon { background: var(--error); }

    .step-text { color: var(--text-secondary); }
    .step-active .step-text { color: var(--text); font-weight: 500; }

    .input-area {
      padding: 16px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--surface-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-box {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 8px;
      transition: all 0.2s;
    }
    .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      resize: none;
      min-height: 40px;
      max-height: 120px;
      padding: 8px;
      outline: none;
    }
    textarea::placeholder { color: var(--text-secondary); }

    .mic-btn, .send-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .mic-btn:hover, .send-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .send-btn { color: var(--accent); }
    .mic-btn.recording { color: var(--error); animation: pulse 1.5s infinite; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stop-btn {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      display: none;
    }
    .stop-btn:hover { background: rgba(239, 68, 68, 0.2); color: white; }

    .confidence-bar {
      height: 4px;
      background: var(--surface-border);
      border-radius: 2px;
      width: 100px;
      overflow: hidden;
      display: none;
    }
    .confidence-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-container">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2>NavisAI</h2>
  </div>

  <div class="chat-container" id="chat">
    <div class="message msg-agent">
      Hi! What can I help you automate today?
    </div>
  </div>

  <div class="input-area">
    <div class="controls">
      <div class="confidence-bar" id="confidence-bar" title="Agent Confidence">
        <div class="confidence-fill" id="confidence-fill"></div>
      </div>
      <button class="stop-btn" id="stop-btn">Stop Agent</button>
    </div>
    
    <div class="input-box">
      <textarea id="task-input" placeholder="Ask me anything..."></textarea>
      <button class="mic-btn" id="mic-btn" title="Use Voice">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
      </button>
      <button class="send-btn" id="send-btn" title="Send Task">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

  <script src="speech.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
