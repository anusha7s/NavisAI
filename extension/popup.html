<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NavisAI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f172a;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --error: #ef4444;
      --success: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 520px;
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
      color: var(--text);
      padding: 0;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: absolute;
      top: -50px;
      left: -50px;
      width: 200px;
      height: 200px;
      background: rgba(99, 102, 241, 0.3);
      filter: blur(80px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo-container {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    .logo-container svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--surface-border);
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Outfit', sans-serif;
      resize: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
      margin-bottom: 16px;
      transition: all 0.3s ease;
    }
    
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    textarea::placeholder {
      color: var(--text-secondary);
      font-weight: 300;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
    }

    #start {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    #start:hover {
      background: linear-gradient(135deg, var(--accent-hover), #4338ca);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }

    #stop {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    #stop:hover {
      background: rgba(239, 68, 68, 0.2);
      color: white;
    }

    .status-container {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .loader {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }
    body.is-running .loader {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    #status.success { color: var(--success); }
    #status.error { color: var(--error); }
    #status.info { color: #60a5fa; }

    #error-message {
      background: rgba(239, 68, 68, 0.1);
      border-left: 3px solid var(--error);
      border-radius: 4px 8px 8px 4px;
      padding: 10px 14px;
      margin-bottom: 16px;
      color: #fca5a5;
      font-size: 0.85rem;
      display: none;
      animation: slideIn 0.3s ease;
    }

    #logs {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 14px;
      height: 180px;
      overflow-y: auto;
      font-size: 0.8rem;
      line-height: 1.6;
      font-family: 'Consolas', 'Courier New', monospace;
      color: #cbd5e1;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    #logs::-webkit-scrollbar { width: 6px; }
    #logs::-webkit-scrollbar-track { background: transparent; }
    #logs::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.1); border-radius: 3px; }

    .log-line {
      margin-bottom: 6px;
      word-break: break-all;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      padding-bottom: 4px;
      animation: slideIn 0.3s ease forwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-container">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>NavisAI</h2>
    </div>

    <textarea id="task" placeholder="What should I do? (e.g. Find cheap flights from NYC to SFO)"></textarea>

    <div class="buttons">
      <button id="start">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        Execute
      </button>
      <button id="stop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
        Stop
      </button>
    </div>

    <div class="status-container">
      <div class="loader"></div>
      <div id="status">Ready and waiting...</div>
    </div>
    
    <div id="error-message"></div>

    <div id="logs"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
